<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Shadow Puppets</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <!-- Main canvas for shadow puppets -->
        <canvas id="puppetCanvas"></canvas>

        <!-- Video element for webcam (hidden) -->
        <video id="webcam" autoplay playsinline></video>

        <!-- UI Overlay - Minimal -->
        <div class="ui-overlay">
            <!-- Help button -->
            <button class="help-button" id="helpButton">?</button>

            <!-- Help panel (hidden by default) -->
            <div class="help-panel hidden" id="helpPanel">
                <button class="close-button" id="closeButton">×</button>
                <h3>Shadow Puppets</h3>
                <div class="help-content">
                    <p><strong>Make hand shapes:</strong></p>
                    <ul>
                        <li>✋ Open Hand → Bird</li>
                        <li>✊ Fist → Dog</li>
                        <li>🤏 Pinch → Rabbit</li>
                    </ul>
                    <p><strong>Two hands:</strong></p>
                    <ul>
                        <li>🙌 Both Open → Butterfly</li>
                        <li>✊✊ Both Fists → Elephant</li>
                    </ul>
                    <p class="tip">Hold a gesture for 2 seconds to summon the animal!</p>
                </div>
            </div>
        </div>

        <!-- Loading indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Initializing hand tracking...</p>
        </div>
    </div>

    <script src="puppets.js"></script>
    <script src="gestures.js"></script>
    <script src="app.js"></script>
</body>
</html>
